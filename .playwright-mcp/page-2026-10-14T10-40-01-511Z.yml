              - generic [ref=e95]:
                - paragraph [ref=e96]:
                  - strong [ref=e97]: 业务边界
                  - generic [ref=e98]: 任务中心是资源异步操作的长期记录和处理入口；消息中心只展示摘要和跳转。
                - generic [ref=e99]:
                  - heading "核心业务逻辑" [level=3] [ref=e100]
                  - list [ref=e101]:
                    - listitem [ref=e102]: 对外任务类型只有知识源同步、元数据补充、自动入目三类；本地上传作为内置知识源，统一产生知识源同步任务。
                    - listitem [ref=e103]: 任务执行完成与业务确认完成是两个维度；有待确认项时不能只显示“已完成”。
                    - listitem [ref=e104]: 部分失败和执行失败支持重试，范围强制限定为本轮失败文件；禁止重跑成功文件，保留历史执行轮次，取消不回滚已经成功的资源。
                    - listitem [ref=e105]: "- 执行失败：整体任务重试 ,- 部分失败：仅重试任务内失败的文件， 原则是： 重试任务是重试失败的文件"
                    - listitem [ref=e106]: 任务名称的命名规则：知识源名称-任务类型-具体到秒的时间点
                    - listitem [ref=e107]: 任务状态是“执行中”：不允许查看任务详情
                - generic [ref=e108]:
                  - heading "研发注意事项" [level=3] [ref=e109]
                  - list [ref=e110]:
                    - listitem [ref=e111]: 任务进度来自真实任务项，不使用前端动画或定时器作为执行事实。
                    - listitem [ref=e112]: 历史自动打标归入元数据补充时，必须保留原始类型和结果。
